general {
    # Use noctalia's session lock instead of hyprlock
    lock_cmd          = noctalia msg session lock
    before_sleep_cmd  = noctalia msg session lock
    after_sleep_cmd   = hyprctl dispatch dpms on && ~/.config/hypr/scripts/kde-cache.sh
    ignore_dbus_inhibit = false
}

# 1. Dim screen warning at 4 min — notify via noctalia toast
listener {
    timeout = 240
    on-timeout = noctalia msg notification-show '{"app_name":"Noctalia","summary":"Idle","body":"Screen locking soon...","timeout_ms":5000}'
    on-resume   = noctalia msg dpms-on
}

# 2. Lock screen at 5 min
listener {
    timeout = 300
    on-timeout = noctalia msg session lock
    on-resume   = noctalia msg dpms-on
}

# 3. Turn off displays at 6 min
listener {
    timeout = 360
    on-timeout = noctalia msg dpms-off
    on-resume   = noctalia msg dpms-on
}

# 4. Suspend at 30 min
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
