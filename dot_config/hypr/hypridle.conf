general {
    # Use noctalia's lockScreen instead of hyprlock
    lock_cmd          = qs -c noctalia-shell ipc call lockScreen lock
    before_sleep_cmd  = qs -c noctalia-shell ipc call lockScreen lock
    after_sleep_cmd   = hyprctl dispatch dpms on && ~/.config/hypr/scripts/kde-cache.sh
    ignore_dbus_inhibit = false
}

# 1. Dim screen warning at 4 min — notify via noctalia toast
listener {
    timeout = 240
    on-timeout = qs -c noctalia-shell ipc call toast send '{"title":"Idle","body":"Screen locking soon...","timeout":5000}'
    on-resume   = qs -c noctalia-shell ipc call monitors on
}

# 2. Lock screen at 5 min
listener {
    timeout = 300
    on-timeout = qs -c noctalia-shell ipc call lockScreen lock
    on-resume   = qs -c noctalia-shell ipc call monitors on
}

# 3. Turn off displays at 6 min
listener {
    timeout = 360
    on-timeout = qs -c noctalia-shell ipc call monitors off
    on-resume   = qs -c noctalia-shell ipc call monitors on
}

# 4. Suspend at 30 min
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
