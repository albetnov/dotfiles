# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# EDIT THIS CONFIG ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################



# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
monitor=,preferred,auto,auto
monitor= DP-2, 1920x1080@60, 0x0, 1


###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = ghostty
$fileManager = dolphin
$browser = zen-browser


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# UI stuff
exec-once = qs -c noctalia-shell
exec-once = hypridle
# Inform Apps that we are on Wayland baby
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
# Activate KWallet for KDE Apps
exec-once = /usr/lib/pam_kwallet_init
# Hyprpolkitagent for GUI sudo prompt?
exec-once = systemctl --user start hyprpolkitagent
# KDE System Associations
exec-once = ~/.config/hypr/scripts/kde-cache.sh

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# QT App 
env = QT_QPA_PLATFORMTHEME,qt6ct
# Fallback to XCB...
env = QT_QPA_PLATFORM,wayland;xcb
env = XDG_CURRENT_DESKTOP,Hyprland

# Electron Stuff
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# SSH Stuff
env = SSH_AUTH_SOCK, $XDG_RUNTIME_DIR/ssh-agent.socket

# Screenshot Stuff
env = GRIMBLAST_EDITOR, satty -f

###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in             = 5
    gaps_out            = 10
    border_size         = 2
    col.active_border   = rgba(3b82f6ee) rgba(7dd3fcee) 45deg
    col.inactive_border = rgba(1e2a3a99)
    resize_on_border    = false
    allow_tearing       = false
    layout              = dwindle
}

# group decoration: https://wiki.hypr.land/Configuring/Variables/#group 
group {
    groupbar {
	enabled       = true
	font_size     = 12
	height        = 22
	render_titles = true
	col.active         = rgba(3b82f6ee)
	col.inactive       = rgba(1e293b88)
	col.locked_active  = rgba(818cf8ee)
	col.locked_inactive= rgba(1e293b55)
    }
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding       = 12
    rounding_power = 2

    active_opacity     = 1.0
    inactive_opacity   = 0.96
    fullscreen_opacity = 1.0

    shadow {
        enabled      = true
        range        = 20
        render_power = 4
        color        = rgba(00000088)
        offset       = 0 8
    }

    blur {
        enabled           = true
        size              = 6
        passes            = 3
        vibrancy          = 0.17
        noise             = 0.01
        new_optimizations = true
        xray              = false
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes

    bezier = overshoot,   0.05, 0.9,  0.1,  1.05
    bezier = snap,        0.1,  1,    0.1,  1
    bezier = linear,      0,    0,    1,    1
    bezier = quick,       0.15, 0,    0.1,  1

    animation = global,        1, 10,  default
    animation = border,        1, 3.5, snap
    animation = windows,       1, 3.8, snap
    animation = windowsIn,     1, 3.2, overshoot,  popin 80%
    animation = windowsOut,    1, 1.2, quick,      popin 80%
    animation = fadeIn,        1, 2.0, quick
    animation = fadeOut,       1, 1.0, quick
    animation = fade,          1, 2.5, quick
    animation = layers,        1, 3.0, snap
    animation = layersIn,      1, 3.0, snap,       fade
    animation = layersOut,     1, 1.0, quick,      fade
    animation = workspaces,    1, 2.8, snap,       slidefadevert 15%
    animation = workspacesIn,  1, 2.8, snap,       slidefadevert 15%
    animation = workspacesOut, 1, 2.0, snap,       slidefadevert 15%
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule {
#     name = no-gaps-wtv1
#     match:float = false
#     match:workspace = w[tv1]
#
#     border_size = 0
#     rounding = 0
# }
#
# windowrule {
#     name = no-gaps-f1
#     match:float = false
#     match:workspace = f[1]
#
#     border_size = 0
#     rounding = 0
# }

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
    smart_split = false
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier
$ipc = qs -c noctalia-shell ipc call

# ── Apps & Launcher ────────────────────────────────────────────
bind = $mainMod, SPACE,  exec, $ipc launcher toggle
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, E,      exec, $fileManager
bind = $mainMod, B,      exec, $browser

# ── Noctalia Shell ─────────────────────────────────────────────
bind = $mainMod, S,            exec, $ipc controlCenter toggle
bind = $mainMod, comma,        exec, $ipc settings toggle
bind = $mainMod, N,            exec, $ipc notifications toggleHistory
bind = $mainMod SHIFT, N,      exec, $ipc notifications toggleDND
bind = $mainMod, W,            exec, $ipc desktopWidgets toggle
bind = $mainMod, D,            exec, $ipc dock toggle
bind = $mainMod, Escape,       exec, $ipc sessionMenu toggle
bind = $mainMod, L,            exec, $ipc lockScreen lock
bind = $mainMod SHIFT, D,      exec, $ipc darkMode toggle
bind = $mainMod SHIFT, I,      exec, $ipc idleInhibitor toggle
bind = $mainMod SHIFT, W,      exec, $ipc wallpaper random

# ── Launcher Modes ─────────────────────────────────────────────
bind = $mainMod, V,    exec, $ipc launcher clipboard
bind = $mainMod, period, exec, $ipc launcher emoji
bind = $mainMod, Tab,  exec, $ipc launcher windows

# ── Window Management ──────────────────────────────────────────
bind = $mainMod, Q,                     killactive
bind = $mainMod, F,         fullscreen, 0
bind = $mainMod SHIFT,      SPACE,      togglefloating
bind = $mainMod SHIFT,      SPACE,      centerWindow
bind = $mainMod, P,                     pseudo
bind = $mainMod, J,         layoutmsg,  togglesplit
bind = $mainMod, backslash, layoutmsg,  swapsplit

# ── Window groups (sway tabbed) ────────────────────────────────
bind = $mainMod, T,            togglegroup
bind = $mainMod, bracketright, changegroupactive, f
bind = $mainMod, bracketleft,  changegroupactive, b
bind = $mainMod SHIFT, T,      movewindoworgroup, l   # drag into neighbour group
bind = $mainMod CTRL, T,       moveoutofgroup

# ── Special workspace (native minimize) ───────────────────────
bind = $mainMod, M,            movetoworkspacesilent, special:minimized
bind = $mainMod SHIFT, M,      togglespecialworkspace, minimized
bind = $mainMod CTRL, M,       movetoworkspace, e+0

# ── Focus ──────────────────────────────────────────────────────
bind = $mainMod, left,  movefocus, l
bind = $mainMod, down,  movefocus, d
bind = $mainMod, up,    movefocus, u
bind = $mainMod, right, movefocus, r

# ── Move Windows ───────────────────────────────────────────────
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r

# ── Resize ─────────────────────────────────────────────────────
bind = $mainMod CTRL, H, resizeactive, -40 0
bind = $mainMod CTRL, J, resizeactive, 0 40
bind = $mainMod CTRL, K, resizeactive, 0 -40
bind = $mainMod CTRL, L, resizeactive, 40 0

# ── Workspaces ─────────────────────────────────────────────────
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

bind  = $mainMod, mouse_down, workspace, e+1
bind  = $mainMod, mouse_up,   workspace, e-1
bindm = $mainMod, mouse:272,  movewindow
bindm = $mainMod, mouse:273,  resizewindow

# ── Media Keys ─────────────────────────────────────────────────
bindel = , XF86AudioRaiseVolume,  exec, $ipc volume increase
bindel = , XF86AudioLowerVolume,  exec, $ipc volume decrease
bindl  = , XF86AudioMute,         exec, $ipc volume muteOutput
bindl  = , XF86AudioMicMute,      exec, $ipc volume muteInput
bindel = , XF86MonBrightnessUp,   exec, $ipc brightness increase
bindel = , XF86MonBrightnessDown, exec, $ipc brightness decrease
bindl  = , XF86AudioPlay,         exec, $ipc media playPause
bindl  = , XF86AudioNext,         exec, $ipc media next
bindl  = , XF86AudioPrev,         exec, $ipc media previous

# ── Screenshots ────────────────────────────────────────────────
# make sure ss_dir exists or grimblast will just error lmao
$ss_dir = ~/Pictures/Screenshots
$grimblast = grimblast --notify --freeze

# Save to file
bind = , Print,             exec, $grimblast save screen $ss_dir/$(date +%Y%m%d_%H%M%S).png
bind = $mainMod, Print,        exec, $grimblast save area $ss_dir/$(date +%Y%m%d_%H%M%S).png
bind = $mainMod ALT, Print,    exec, $grimblast save active $ss_dir/$(date +%Y%m%d_%H%M%S).png
bind = $mainMod CTRL, Print,   exec, $grimblast save output $ss_dir/$(date +%Y%m%d_%H%M%S).png

# Copy to clipboard only
bind = SHIFT, Print,        exec, $grimblast copy screen
bind = $mainMod SHIFT, Print,  exec, $grimblast copy area
bind = $mainMod SHIFT ALT, Print, exec, $grimblast copy active

# Save + copy
bind = CTRL, Print,         exec, $grimblast copysave area $ss_dir/$(date +%Y%m%d_%H%M%S).png

# Edit (opens in gimp or $GRIMBLAST_EDITOR)
bind = $mainMod CTRL ALT, Print, exec, $grimblast edit area

# ── Noctalia ────────────────────────────────────────────────────
# restart noctalia when it crashes (it does that sometimes for some reason, not sure why)
bind = $mainMod SHIFT, R, exec, pkill quickshell; nohup qs -c noctalia-shell > /dev/null 2>&1 &

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# WORKSPACES ARE DISABLED IN FAVOR OF DYNAMIC SCRIPT.

# Example windowrules that are useful

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

windowrule {
    name = xwayland-video-bridge-fixes
    match:class = xwaylandvideobridge

    no_initial_focus = true
    no_focus = true
    no_anim = true
    no_blur = true
    max_size = 1 1
    opacity = 0.0
}

layerrule {
  name = noctalia
  match:namespace = noctalia-background-.*$
  ignore_alpha = 0.5
  blur = true
  blur_popups = true
}

# center everything except Zoom, as this app is peak stupidity.
windowrule {
    name = center-floating
    match:float = on
    # Regex translation: "Match any string that does NOT contain 'zoom' or 'Zoom'"
    match:class = ^(?!.*(zoom|Zoom)).*$
    center = on
}

# --- ZOOM SETTINGS: A TOTAL MASTERPIECE ---
# Did the developers at Zoom skip the day they taught basic in-app stack rendering?
# Why use normal app behavior when you can just spawn a whole new window and manually guess where to put it on the screen? Pure genius! For fuck's sake.
# Calling this the worst desktop app design I have ever seen is honestly too nice. It's just embarrassing.
# I’ve tried editing my window rules like 7 times already. But Zoom is so completely fucked that no rule on earth can fix their garbage popup system. You just can't fix stupid.

# ── Zoom: global rules (all zoom windows) ────────────────────────
windowrule {
    name         = zoom-global
    match:class  = ^(zoom)$

    idle_inhibit = always
    no_blur      = on
}

# ── Zoom: float all secondary/popup windows ──────────────────────
windowrule {
    name                = zoom-floats
    match:class         = ^(zoom)$
    match:initial_title = ^(zoom|Settings|Chat|menu window|confirm window|Breakout rooms - In Progress|ZOOM|annotate_toolbar)$

    float  = on
    center = on
}

# ── Zoom: stay_focused for disappearing popups ───────────────────
windowrule {
    name        = zoom-stay-focused
    match:class = ^(zoom)$
    match:title = ^(menu window|confirm window)$

    stay_focused = on
}

# ── Zoom: suppress focus stealing ────────────────────────────────
windowrule {
    name                = zoom-no-focus
    match:class         = ^(zoom)$
    match:initial_title = ^(zoom)$

    no_initial_focus = on
}

# --- ANDROID STUDIO TOOLTIPS: PURE COMEDY ---
# Time to put baby gates around Android Studio tooltips before they fuck up the whole screen.
# Seriously, what the fuck JetBrains? You guys literally built Compose Multiplatform so we can stack UI nicely. 
# But doing that exact same basic thing inside your own fucking IDE? Nah, too hard apparently! 
# Imagine making amazing UI tools for the whole world to use, but your own app's tooltips just run around like headless chickens. Peak clown behavior.
windowrule {
    name = "please-behave-android-studio"
    # Match the class
    match:initial_class = ^jetbrains-studio$
    # ONLY match the tooltips (usually titled "win0", "win1", etc.)
    match:initial_title = ^win[0-9]+$
    
    # Rules for tooltips ONLY
    no_initial_focus = 1
    float = 1
}

